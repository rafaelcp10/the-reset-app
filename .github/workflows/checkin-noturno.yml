name: Notificações

# O cron da Vercel exige plano Pro para rodar mais de uma vez por dia, e o
# app precisa de meia em meia hora para cobrir os cinco horários de
# check-in nos fusos de cada pessoa. O Actions faz isso de graça.
on:
  schedule:
    - cron: "0,30 * * * *"
  # Permite disparar à mão pelo painel do GitHub, para testar.
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      # Sem este passo o runner começa com a pasta vazia, e o script abaixo
      # não existe: o bash responde 127 ("não encontrado"). Foi o que
      # aconteceu de 2026-09-18 a 2026-10-24 — o script saiu do YAML, este
      # passo nunca entrou, e 191 disparos seguidos falharam sem que nenhuma
      # notificação agendada saísse. Só a pasta dos scripts: o resto do
      # repositório não é usado aqui.
      - name: Baixar o script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # As duas rotas usam o mesmo script. Nada de continuação de linha com
      # barra invertida aqui: uma barra perdida na hora de editar o arquivo
      # transforma o comando em duas linhas, o YAML inteiro fica inválido e
      # o GitHub para de rodar o workflow — inclusive o check-in noturno,
      # que não tem nada a ver com a alteração.
      - name: Chamar a rota do check-in
        env:
          ROTA: checkin
        run: bash .github/scripts/chamar-cron.sh "$ROTA"
        shell: bash

      # Os lembretes da Saúde rodam no mesmo job: é a mesma chave, o
      # mesmo cron de meia em meia hora, e a própria rota decide de quem é
      # a vez no fuso de cada pessoa. Um workflow separado só duplicaria o
      # segredo e a chance de um dos dois ficar para trás.
      #
      # `!cancelled()`: roda mesmo se o check-in falhou. São avisos
      # independentes, e uma rota fora do ar não pode calar a outra.
      - name: Chamar a rota dos lembretes da Saúde
        if: ${{ !cancelled() }}
        env:
          ROTA: lembretes
        run: bash .github/scripts/chamar-cron.sh "$ROTA"
        shell: bash
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
